:root{--ink:#14283c;--bg:#fbfbf6;--mut:#5c6b78;--acc:#f2b705;--line:rgba(20,40,60,.14);color-scheme:light}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#e9ecdd;color:var(--ink);font:500 14px/1.4 "Figtree",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;left:50%;transform:translateX(-50%);top:max(10px,env(safe-area-inset-top,0px));width:min(calc(100% - 20px),560px);display:flex;gap:8px;align-items:center;z-index:5}

<script>
const W=2000,H=3300,TAU=Math.PI*2;

/* ---------- Dil (TR/EN) ---------- */
const LANG_KEY='bogaz-taksi-lang';
const THEME_KEY='bogaz-taksi-theme';
let THEME='acik';
let LANG='tr';
try{const q=new URLSearchParams(location.search).get('lang');
  if(q==='en'||q==='tr')LANG=q;else{const sv=localStorage.getItem(LANG_KEY);if(sv==='en'||sv==='tr')LANG=sv}}catch(_){}
try{const tv=localStorage.getItem(THEME_KEY);if(tv==='koyu'||tv==='acik'){THEME=tv;document.documentElement.setAttribute('data-theme',tv)}}catch(_){}
const t=(tr,en)=>LANG==='en'?en:tr;
const LOC=()=>LANG==='en'?'en-US':'tr-TR';

document.querySelectorAll('[data-en-aria]').forEach(el=>{el.dataset.trAria=el.getAttribute('aria-label')});
document.querySelectorAll('[data-en-alt]').forEach(el=>{el.dataset.trAlt=el.getAttribute('alt')});
function applyStaticLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-en]').forEach(el=>{el.innerHTML=LANG==='en'?el.dataset.en:el.dataset.tr});
  document.querySelectorAll('[data-en-aria]').forEach(el=>{el.setAttribute('aria-label',LANG==='en'?el.dataset.enAria:el.dataset.trAria)});
  document.querySelectorAll('[data-en-alt]').forEach(el=>{el.setAttribute('alt',LANG==='en'?el.dataset.enAlt:el.dataset.trAlt)});
  document.querySelectorAll('.lang-tg span[data-l]').forEach(sp=>sp.classList.toggle('on',sp.dataset.l===LANG));
  document.querySelectorAll('.lang-tg').forEach(b=>b.title=LANG==='en'?'Türkçe’ye geç':'Switch to English');
  document.querySelectorAll('.theme-tg').forEach(b=>b.title=THEME==='koyu'?(LANG==='en'?'Switch to light theme':'Açık moda geç'):(LANG==='en'?'Switch to dark theme':'Koyu moda geç'));
}
applyStaticLang();
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- Map: water = thick splines ---------- */
const B=[[1640,-560,760],[1570,-300,470],[1515,-90,260],[1482,90,165],[1480,150,150],[1420,350,170],[1345,520,185],[1330,700,150],[1380,880,140],[1400,1050,135],[1370,1220,120],[1330,1380,98],[1280,1530,120],[1260,1680,110],[1210,1830,125],[1140,1970,135],[1065,2100,150],[1000,2230,165],[985,2390,190],[1012,2550,212],[1035,2700,280]];
const G=[[860,2440,75],[740,2410,64],[630,2360,58],[530,2290,55],[440,2200,52],[370,2090,48],[320,1970,42],[295,1860,34]];
const M=[[-150,3080,300],[250,3020,300],[620,2985,300],[1045,2935,315],[1300,3050,280],[1480,3260,250],[1650,3620,420]];
const RECTS=[[-700,3050,2150,1700],[-1000,-2300,4000,1900]]; // Marmara ve Karadeniz açıkları
function cr(a,b,c,d,t){return .5*(2*b+(c-a)*t+(2*a-5*b+4*c-d)*t*t+(3*b-a-3*c+d)*t*t*t)}
function spline(N,step){const o=[];for(let i=0;i<N.length-1;i++){const a=N[Math.max(i-1,0)],b=N[i],c=N[i+1],d=N[Math.min(i+2,N.length-1)];
  const n=Math.ceil(Math.hypot(c[0]-b[0],c[1]-b[1])/step);for(let k=0;k<n;k++){const t=k/n;o.push([cr(a[0],b[0],c[0],d[0],t),cr(a[1],b[1],c[1],d[1],t),cr(a[2],b[2],c[2],d[2],t)])}}
  o.push(N[N.length-1].slice());return o}
const S=[...spline(B,12),...spline(G,8),...spline(M,26)];
function trace(c,pad,v){c.beginPath();for(const p of S){const r=p[2]+pad;if(r<=3)continue;
  if(v&&(p[0]+r<v.x0||p[0]-r>v.x1||p[1]+r<v.y0||p[1]-r>v.y1))continue;c.moveTo(p[0]+r,p[1]);c.arc(p[0],p[1],r,0,TAU)}
  for(const R of RECTS)c.rect(R[0]-pad,R[1]-pad,R[2]+2*pad,R[3]+2*pad)}
const MW=W/4;
function mask(pad){const w=W/4,h=H/4,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#000';x.fillRect(0,0,w,h);x.scale(.25,.25);x.fillStyle='#fff';trace(x,pad);x.fill();
  const d=x.getImageData(0,0,w,h).data,m=new Uint8Array(w*h);for(let i=0;i<m.length;i++)m[i]=d[i*4]>127?1:0;return m}
const mWater=mask(0),mNav=mask(-9);
function at(m,x,y){if(x<10||y<10||x>W-10||y>H-10)return 0;return m[((y/4)|0)*MW+((x/4)|0)]}
const KIZ={x:1125,y:2415};
const nav=(x,y)=>at(mNav,x,y)&&Math.hypot(x-KIZ.x,y-KIZ.y)>20;
function march(x,y,dx,dy){const l=Math.hypot(dx,dy);dx/=l;dy/=l;for(let i=0;i<500&&at(mWater,x,y);i++){x+=dx*2;y+=dy*2}return{x,y,dx,dy}}

/* ---------- Piers ---------- */
const E='Avrupa',A='Anadolu',JN={x:900,y:2440};
const PD=[
 ['Rumeli Kavağı',1480,150,-1,0,E,'N',''],['Sarıyer',1420,350,-1,0,E,'N','f'],['Tarabya',1330,700,-1,0,E,'N',''],
 ['Yeniköy',1380,880,-1,0,E,'N',''],['İstinye',1400,1050,-1,0,E,'N','fy'],['Emirgan',1370,1220,-1,0,E,'N',''],
 ['Bebek',1280,1530,-1,0,E,'N','f'],['Arnavutköy',1260,1680,-1,0,E,'N',''],['Ortaköy',1140,1970,-1,0,E,'N',''],
 ['Beşiktaş',1065,2100,-1,0,E,'N','f'],['Kabataş',1000,2172,-1,0,E,'N',''],
 ['Anadolu Kavağı',1480,150,1,0,A,'N',''],['Beykoz',1330,700,1,0,A,'N','f'],['Paşabahçe',1380,880,1,0,A,'N',''],
 ['Çubuklu',1400,1050,1,0,A,'N',''],['Kanlıca',1370,1220,1,0,A,'N','f'],['Anadolu Hisarı',1330,1380,1,0,A,'N',''],
 ['Kandilli',1280,1530,1,0,A,'N',''],['Çengelköy',1210,1830,1,0,A,'N',''],['Beylerbeyi',1140,1970,1,0,A,'N',''],
 ['Kuzguncuk',1065,2100,1,0,A,'N',''],['Üsküdar',1000,2230,1,0,A,'N','f'],
 ['Harem',990,2550,1,0,A,'S',''],['Haydarpaşa',1000,2700,1,.1,A,'S','y'],['Kadıköy',1300,3050,.75,-.66,A,'S','f'],
 ['Yenikapı',420,3000,0,-1,E,'S',''],
 ['Karaköy',788,2420,0,-1,E,'G','f'],['Eminönü',772,2450,0,1,E,'G',''],['Kasımpaşa',630,2360,.45,-.89,E,'G','y'],
 ['Fener',530,2290,-.62,.78,E,'G',''],['Hasköy',440,2200,.78,-.62,E,'G',''],['Balat',440,2200,-.78,.62,E,'G',''],
 ['Sütlüce',370,2090,.89,-.46,E,'G',''],['Eyüp',320,1970,-1,.15,E,'G','f']
];
const PIERS=PD.map(d=>{const s=march(d[1],d[2],d[3],d[4]);let off=22,wx,wy;
  do{wx=s.x-s.dx*off;wy=s.y-s.dy*off;off+=4}while(!nav(wx,wy)&&off<70);
  const k=d[6]==='N'?(JN.y-s.y)*1.05+60:Math.hypot(s.x-JN.x,s.y-JN.y)+(d[6]==='G'?30:0);
  return{name:d[0],x:s.x,y:s.y,dx:s.dx,dy:s.dy,wx,wy,side:d[5],br:d[6],k,fuel:d[7].includes('f'),yard:d[7].includes('y')}});
const START=PIERS.findIndex(p=>p.name==='Karaköy');
function route(a,b){const e=Math.hypot(a.x-b.x,a.y-b.y);return Math.max(e,a.br===b.br?Math.abs(a.k-b.k):a.k+b.k)}

function span(x,y,dx,dy){const a=march(x,y,dx,dy),b=march(x,y,-dx,-dy);return[a.x+a.dx*8,a.y+a.dy*8,b.x+b.dx*8,b.y+b.dy*8]}
const BRIDGES=[
 {n:'Yavuz Sultan Selim Köprüsü',p:span(1481,120,1,0)},
 {n:'Fatih Sultan Mehmet Köprüsü',p:span(1348,1310,1,0)},
 {n:'15 Temmuz Şehitler Köprüsü',p:span(1178,1900,1,.1)},
 {n:'Galata Köprüsü',p:span(726,2415,.33,-.94)},
 {n:'Atatürk Köprüsü',p:span(655,2372,.45,-.89)},
 {n:'Haliç Köprüsü',p:span(402,2148,.84,-.54)}
];
const MARKS=[['tower','Galata Kulesi',735,2252],['port','Galataport',811,2262],['palace','Dolmabahçe Sarayı',858,2122],['palace','Çırağan Sarayı',928,2028],['palace','Beylerbeyi Sarayı',1322,2022],(()=>{const q=PIERS.find(z=>z.name==='Haydarpaşa');return['station','Haydarpaşa Garı',q.x+q.dx*32,q.y-40]})(),['tower','Anadolu Hisarı',1468,1392],['tower','Topkapı Sarayı',748,2548],['mosque','Ayasofya',700,2592],['mosque','Sultanahmet',648,2622],['mosque','Süleymaniye',548,2452],
 ['tower','Rumeli Hisarı',1190,1392],['spire','Çamlıca Kulesi',1420,2255],['mosque','Eyüp Sultan',235,1985],
 ['mosque','Ortaköy Camii',958,1934],['mosque','Çamlıca Camii',1560,1895],['tram','Taksim',755,2175]]
 .filter(m=>!at(mWater,m[2],m[3]));


/* ---------- Harita: semt adları, sahil yolları, işaretli iç kesim evleri (statik katman; ekonomi/hareket yok) ---------- */
function landOK(x,y,m){
  m=m||12;
  if(x<18||y<18||x>W-18||y>H-18)return false;
  if(at(mWater,x,y))return false;
  for(let a=0;a<8;a++){
    const r=m,ang=a*TAU/8;
    if(at(mWater,x+Math.cos(ang)*r,y+Math.sin(ang)*r))return false;
  }
  return true;
}
function coastWalk(cx,cy,dx,dy,inset){
  const s=march(cx,cy,dx,dy);
  const x=s.x+s.dx*inset,y=s.y+s.dy*inset;
  return landOK(x,y,10)?[x,y]:null;
}
function splitRoad(pts,maxGap){
  const out=[];let cur=[];
  for(const p of pts){
    if(!p){if(cur.length>2)out.push(cur);cur=[];continue}
    if(cur.length&&Math.hypot(p[0]-cur[cur.length-1][0],p[1]-cur[cur.length-1][1])>maxGap){
      if(cur.length>2)out.push(cur);cur=[p];
    }else cur.push(p);
  }
  if(cur.length>2)out.push(cur);
  return out;
}
function pushRoadSamples(arr,samples,dx,dy,inset){
  for(const p of samples)arr.push(coastWalk(p[0],p[1],dx,dy,inset));
}

const MAP_ROADS=[];
const MAP_HOUSES=[];
const MAP_DISTS=[];

function buildMapDecor(){
  const Bs=spline(B,22),Gs=spline(G,14),Ms=spline(M,26);
  const euro=[],asia=[],euroIn=[],asiaIn=[],hornA=[],hornB=[],marmN=[],kadik=[];
  pushRoadSamples(euro,Bs,-1,0,24);
  pushRoadSamples(asia,Bs,1,0,24);
  pushRoadSamples(euroIn,Bs,-1,0,78);
  pushRoadSamples(asiaIn,Bs,1,0,78);
  for(let i=0;i<Gs.length;i++){
    const p=Gs[i],q=Gs[Math.min(i+1,Gs.length-1)];
    let tx=q[0]-p[0],ty=q[1]-p[1],L=Math.hypot(tx,ty)||1;tx/=L;ty/=L;
    hornA.push(coastWalk(p[0],p[1],-ty,tx,16));
    hornB.push(coastWalk(p[0],p[1],ty,-tx,16));
  }
  for(const p of Ms){
    const n=coastWalk(p[0],p[1],0,-1,22);
    if(n&&n[0]<1150)marmN.push(n);
    const se=coastWalk(p[0],p[1],.7,.7,22)||coastWalk(p[0],p[1],0,1,22)||coastWalk(p[0],p[1],1,0,22);
    if(se&&se[0]>900)kadik.push(se);
  }
  for(const line of [euro,asia,euroIn,asiaIn,hornA,hornB,marmN,kadik]){
    for(const seg of splitRoad(line,70))MAP_ROADS.push(seg);
  }

  function houseFits(x,y,minGap){
    minGap=minGap||20;
    if(!landOK(x,y,12))return false;
    if(Math.hypot(x-KIZ.x,y-KIZ.y)<36)return false;
    if(Math.hypot(x-450,y-2580)<36)return false; /* TARİHÎ YARIMADA yazısı */
    for(const p of PIERS){
      if(Math.hypot(x-p.wx,y-p.wy)<40)return false;
      if(Math.hypot(x-p.x,y-p.y)<22)return false;
      const lx=p.x+p.dx*14,ly=p.y+p.dy*16;
      if(Math.hypot(x-lx,y-ly)<38)return false;
      if(Math.hypot(x-(lx-20),y-ly)<28||Math.hypot(x-(lx+20),y-ly)<28)return false;
      if(Math.hypot(x-lx,y-(ly+13))<24)return false;
    }
    for(const m of MARKS){if(Math.hypot(x-m[2],y-m[3])<32)return false}
    for(const d of MAP_DISTS){if(Math.hypot(x-d.x,y-d.y)<28)return false}
    for(const h of MAP_HOUSES){if(Math.hypot(x-h.x,y-h.y)<minGap)return false}
    return true;
  }
  function addHouse(x,y,seed,region){
    MAP_HOUSES.push({
      x,y,
      w:12+hsh(seed,3)*5,
      h:8.5+hsh(seed,7)*3.5,
      roof:4+hsh(seed,5)*1.6,
      a:0,
      tone:hsh(seed,9),
      region:region||''
    });
  }
  /* Evler yalnızca Doğancan'ın kırmızı işaretlediği iç kesimlerde; çatılar yukarı; orta sıklık. */
  const HOUSE_ZONES=[
    {id:'sutluce_haskoy',cx:560,cy:2075,rx:85,ry:55,n:8},
    {id:'besiktas_arka',cx:745,cy:2030,rx:80,ry:52,n:8},
    {id:'kasimpasa_taksim',cx:700,cy:2238,rx:70,ry:48,n:7},
    {id:'tarihi_yarimada',cx:400,cy:2585,rx:115,ry:78,n:10},
    {id:'haydarpasa_arka',cx:1540,cy:2690,rx:88,ry:62,n:8},
    {id:'kadikoy_arka',cx:1688,cy:2910,rx:92,ry:62,n:8},
    {id:'cengelkoy_arka',cx:1565,cy:1730,rx:88,ry:60,n:8},
    {id:'bebek_arnavutkoy',cx:980,cy:1625,rx:75,ry:145,n:10},
    {id:'kuzguncuk_arka',cx:1440,cy:2090,rx:80,ry:55,n:7},
    {id:'uskudar_arka',cx:1325,cy:2270,rx:78,ry:65,n:8}
  ];
  function inZone(z,x,y){
    const dx=(x-z.cx)/z.rx, dy=(y-z.cy)/z.ry;
    return dx*dx+dy*dy<=1;
  }
  for(let z=0;z<HOUSE_ZONES.length;z++){
    const Z=HOUSE_ZONES[z];
    let n=0,tries=0;
    while(n<Z.n&&tries<Z.n*40){
      tries++;
      const u=hsh(z+11,tries),vv=hsh(tries,z+19);
      const ang=u*TAU,r=Math.sqrt(vv)*0.92;
      const x=Z.cx+Math.cos(ang)*r*Z.rx;
      const y=Z.cy+Math.sin(ang)*r*Z.ry;
      if(!inZone(Z,x,y))continue;
      if(!houseFits(x,y,20))continue;
      addHouse(x,y,z*40+n,Z.id);
      n++;
    }
  }

  function addDist(n,ne,x,y){
    let px=x,py=y;
    if(!landOK(px,py,14)){
      const tries=[[-12,0],[12,0],[0,-12],[0,12],[-20,0],[20,0],[0,-20],[0,20],[8,-16],[-8,-16]];
      for(const [dx,dy] of tries){if(landOK(x+dx,y+dy,14)){px=x+dx;py=y+dy;break}}
    }
    if(!landOK(px,py,8))return;

  const tx=t0%PGW,ty=t0/PGW|0,hh=c=>{const dx=Math.abs(c%PGW-tx),dy=Math.abs((c/PGW|0)-ty);return Math.max(dx,dy)+.414*Math.min(dx,dy)};
  const hp=[],hf=[];const push=(c,f)=>{let i=hp.length;hp.push(c);hf.push(f);while(i>0){const q=(i-1)>>1;if(hf[q]<=f)break;hp[i]=hp[q];hf[i]=hf[q];i=q}hp[i]=c;hf[i]=f};
  const pop=()=>{const top=hp[0],lc=hp.pop(),lf=hf.pop();if(hp.length){let i=0;for(;;){let l=2*i+1,r=l+1,m=i,mf=lf;if(l<hp.length&&hf[l]<mf){m=l;mf=hf[l]}if(r<hp.length&&hf[r]<mf){m=r;mf=hf[r]}if(m===i)break;hp[i]=hp[m];hf[i]=hf[m];i=m}hp[i]=lc;hf[i]=lf}return top};
  let ok=s0>=0&&t0>=0;if(ok){G[s0]=0;push(s0,hh(s0));ok=false;
    while(hp.length){const c=pop();if(done[c])continue;done[c]=1;if(c===t0){ok=true;break}const ci=c%PGW,cj=c/PGW|0;
      for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const ii=ci+di,jj=cj+dj;if(ii<0||jj<0||ii>=PGW||jj>=PGH)continue;const n=jj*PGW+ii;if(!g[n]||done[n])continue;

/* ---------- Hatlar ---------- */
function segPath(a,b){return wpathXY(PIERS[a],PIERS[b],'f'+a+'>'+b)}
function rebuild(L){const pts=[],stops=[];let s=0;
  for(let k=0;k<L.piers.length;k++){if(k===0){pts.push([PIERS[L.piers[0]].wx,PIERS[L.piers[0]].wy]);stops.push(0);continue}
    const P=segPath(L.piers[k-1],L.piers[k]).pts;for(let i=1;i<P.length;i++){s+=Math.hypot(P[i][0]-pts[pts.length-1][0],P[i][1]-pts[pts.length-1][1]);pts.push(P[i])}stops.push(s)}
  const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  L.pts=pts;L.cum=cum;L.len=cum[cum.length-1]||0;L.stops=stops;
  for(const b of L.boats){b.si=clamp(b.si,0,L.piers.length-1);b.s=stops[b.si];b.dwell=.3}}
function posAt(L,s){const c=L.cum;let lo=0,hi=c.length-1;s=clamp(s,0,L.len);while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=s)lo=m;else hi=m}
  const a=L.pts[lo],b=L.pts[hi]||a,d=(c[hi]-c[lo])||1,k=(s-c[lo])/d;return{x:a[0]+(b[0]-a[0])*k,y:a[1]+(b[1]-a[1])*k,a:Math.atan2(b[1]-a[1],b[0]-a[0])}}
function newBoat(L,big){return{s:0,si:0,dir:1,dwell:.5,cap:big?12:6,big:!!big,pax:[]}}
// Ağ mesafesi: her tür için, iskeleden o türde en yakın iskeleye kaç durak var (hatlar üzerinden)
let DT=null,DTsig='';
function dists(){const sig=GM.lines.map(L=>L.piers.join(',')).join('|')+'#'+GM.open.length;if(DT&&sig===DTsig)return DT;DTsig=sig;
  const adj={};for(const L of GM.lines)for(let k=1;k<L.piers.length;k++){const a=L.piers[k-1],b=L.piers[k];(adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a)}
  DT={};for(const T of ['ev','is','tur']){const d={},Q=[];for(const i of GM.open)if(ptype(i)===T){d[i]=0;Q.push(i)}
    for(let h=0;h<Q.length;h++){const u=Q[h];for(const w of adj[u]||[])if(d[w]===undefined){d[w]=d[u]+1;Q.push(w)}}DT[T]=d}return DT}
const dd=(T,p)=>{const v=dists()[T][p];return v===undefined?1e9:v};
function lineBest(L,T,except){let m=1e9;for(const q of L.piers)if(q!==except)m=Math.min(m,dd(T,q));return m}
function wantsBoard(L,p,T){return lineBest(L,T,p)<dd(T,p)}
function shouldAlight(L,p,T){return dd(T,p)<=lineBest(L,T,p)}

/* ---------- Simülasyon ---------- */
function step(dt){time+=dt*(320/DAYLEN);GM.t+=dt;const day=GM.t/DAYLEN|0;
  if(day>GM.day){GM.day=day;const cost=UPKEEP*boatsTotal();GM.money-=cost;toast(t('Yeni gün · bakım −₺','New day · upkeep −₺')+cost);if(GM.day%7===0){GM.week++;weekly()}save()}
  // yeni iskele
  if(GM.t>=GM.next&&GM.unlock<UNLOCK.length){const i=UNLOCK[GM.unlock++];GM.open.push(i);GM.next=GM.t+DAYLEN*(1.1+Math.random()*.5);toast('⚓ '+t('Yeni iskele açıldı: ','New pier opened: ')+PIERS[i].name);pingAt=i;pingT=3}
  // yolcu üretimi
  const rate=.036*(1+GM.t/DAYLEN*.1);
  for(const i of GM.open){if(Math.random()<rate*dt){const types=['ev','is','tur'].filter(T=>T!==ptype(i)&&GM.open.some(j=>ptype(j)===T));if(types.length){(GM.q[i]=GM.q[i]||[]).push(types[(Math.random()*types.length)|0])}}
    const n=(GM.q[i]||[]).length;if(n>QMAX){GM.ov[i]=(GM.ov[i]||0)+dt;if(GM.ov[i]>=OVER){gameOver(i);return}}else if(GM.ov[i])GM.ov[i]=Math.max(0,GM.ov[i]-dt*1.5)}
  // tekneler
  for(const L of GM.lines){if(L.piers.length<2)continue;
    for(const b of L.boats){
      if(b.dwell>0){b.dwell-=dt;continue}
      const tgt=L.stops[b.si+b.dir];if(tgt===undefined){b.dir*=-1;continue}
      const v=(b.big?52:62)*dt;
      if(Math.abs(tgt-b.s)<=v){b.s=tgt;b.si+=b.dir;dock(L,b)}else b.s+=Math.sign(tgt-b.s)*v}}
  if(GM.money<-3000){gameOver(-1)}}
function dock(L,b){const p=L.piers[b.si],T=ptype(p);let moved=0,earn=0;
  b.pax=b.pax.filter(x=>{if(x===T){moved++;earn+=FARE;GM.deliv++;return false}
    if(shouldAlight(L,p,x)&&dd(x,p)<1e9){(GM.q[p]=GM.q[p]||[]).push(x);moved++;return false}return true});
  const q=GM.q[p]||[];for(let k=0;k<q.length&&b.pax.length<b.cap;){if(wantsBoard(L,p,q[k])){b.pax.push(q.splice(k,1)[0]);moved++}else k++}
  if(earn){GM.money+=earn;pops.push({x:PIERS[p].wx,y:PIERS[p].wy,txt:'+₺'+earn,t:1.2})}
  if(b.si===0||b.si===L.piers.length-1)b.dir=b.si===0?1:-1;
  b.dwell=.5+moved*.12}

  GM.lines.forEach((L,li)=>{if(L.pts.length<2)return;ctx.strokeStyle='rgba(20,40,60,.25)';ctx.lineWidth=(li===selLine?11:8)/z;ctx.beginPath();L.pts.forEach((p,k)=>k?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    ctx.strokeStyle=L.col;ctx.lineWidth=(li===selLine?8:5.5)/z;ctx.stroke()});
  if(drag&&drag.kind==='line'&&drag.wx!==undefined){const L=GM.lines[drag.li],e=drag.end==='a'?L.piers[0]:L.piers[L.piers.length-1];ctx.setLineDash([8/z,7/z]);ctx.strokeStyle=L.col;ctx.lineWidth=4/z;ctx.beginPath();ctx.moveTo(PIERS[e].wx,PIERS[e].wy);ctx.lineTo(drag.wx,drag.wy);ctx.stroke();ctx.setLineDash([])}
  // iskeleler
  for(let i=0;i<PIERS.length;i++){const p=PIERS[i];if(p.wx<v.x0-80||p.wx>v.x1+80||p.wy<v.y0-60||p.wy>v.y1+60)continue;const op=isOpen(i),T=TYPES[ptype(i)];
    ctx.strokeStyle=op?'#14283c':'rgba(20,40,60,.25)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(p.x+p.dx*4,p.y+p.dy*4);ctx.lineTo(p.wx,p.wy);ctx.stroke();
    if(!op){shape(T.sh,p.wx,p.wy,5/z+3,'rgba(255,255,255,.5)','rgba(20,40,60,.3)',1.2/z);continue}
    const ov=GM.ov[i]||0;if(ov>0){ctx.strokeStyle='#e63946';ctx.lineWidth=4/z;ctx.beginPath();ctx.arc(p.wx,p.wy,16/z+8,-Math.PI/2,-Math.PI/2+TAU*ov/OVER);ctx.stroke()}
    if(pingAt===i&&pingT>0){ctx.strokeStyle='#f2b705';ctx.lineWidth=3/z;ctx.beginPath();ctx.arc(p.wx,p.wy,(14+(3-pingT)*30)/z+6,0,TAU);ctx.stroke()}
    shape(T.sh,p.wx,p.wy,8/z+4,'#fbfcf7','#14283c',2.4/z);
    ctx.textAlign=p.dx>.3?'left':p.dx<-.3?'right':'center';ctx.textBaseline='middle';halo(p.name,p.x+p.dx*14,p.y+p.dy*16,pal.ink,pal.land,FS.pier,700);
    const q=GM.q[i]||[];const r=4.4/z+.8,gap=r*2.5;for(let k=0;k<Math.min(q.length,QMAX+4);k++){const col=k%5,row=k/5|0;shape(TYPES[q[k]].sh,p.wx+(14/z+7)+col*gap,p.wy-(8/z+4)+row*gap,r,k>=QMAX?'#e63946':'#14283c')}}
  // tekneler
  GM.lines.forEach(L=>{if(L.pts.length<2)return;for(const b of L.boats){const P=posAt(L,b.s);ctx.save();ctx.translate(P.x,P.y);ctx.rotate(P.a+(b.dir<0?Math.PI:0));const s=(b.big?1.35:1)/Math.max(.6,z)*1.1;ctx.scale(s,s);
    ctx.fillStyle=L.col;ctx.strokeStyle='#14283c';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(6,-6);ctx.lineTo(-11,-6);ctx.lineTo(-11,6);ctx.lineTo(6,6);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fbfcf7';for(let k=0;k<b.pax.length;k++){const x=-8+(k%6)*3.1,y=k<6?-2.4:2.4;shape(TYPES[b.pax[k]].sh,x,y,1.2,'#fbfcf7')}ctx.restore()}});
  // kazanç baloncukları
  ctx.textAlign='center';for(const P of pops){ctx.globalAlpha=Math.min(1,P.t);halo(P.txt,P.x,P.y-30/z-(1.2-P.t)*20/z,'#0a7d4f',pal.land,12,800)}ctx.globalAlpha=1}
function drawBills(v,pal){BILLS.forEach((B,i)=>{if(B.x<v.x0-60||B.x>v.x1+60||B.y<v.y0-40||B.y>v.y1+40)return;const P=(LANG==='en'?PROMO_EN:PROMO)[(i+(time/40|0))%PROMO.length];
  ctx.save();ctx.translate(B.x,B.y);ctx.rotate(B.ang);ctx.fillStyle='rgba(20,40,60,.15)';ctx.fillRect(-34,-15,72,30);ctx.fillStyle='#14283c';ctx.fillRect(-2,10,3,10);
  ctx.fillStyle='#fbfcf7';ctx.strokeStyle='#14283c';ctx.lineWidth=1.4;ctx.fillRect(-36,-18,72,30);ctx.strokeRect(-36,-18,72,30);ctx.fillStyle='#f2b705';ctx.fillRect(-36,-18,4,30);
  ctx.fillStyle='#14283c';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`800 8.5px ${FD}`;ctx.fillText(P[0],2,-8);ctx.font=`600 5.6px ${FD}`;ctx.fillStyle='#4a5a68';ctx.fillText(P[1],2,3);ctx.restore()})}

/* ---------- Arayüz ---------- */
let toastT=null;function toast(m){const e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2600)}
const fmt=n=>'₺'+Math.round(n).toLocaleString(LOC());
function clock(){const f=(GM.t%DAYLEN)/DAYLEN,h=(6+f*18)|0;return String(h).padStart(2,'0')+':00'}
function ui(){if(!GM)return;$('hm').textContent=fmt(GM.money);$('hm').classList.toggle('neg',GM.money<0);$('hd').textContent=t('Hafta ','Wk ')+(GM.week+1)+' · '+t('Gün ','Day ')+(GM.day%7+1)+' · '+clock();$('hp').textContent=GM.deliv;
  document.querySelectorAll('[data-sp]').forEach(b=>b.setAttribute('aria-pressed',(paused?0:speed)==+b.dataset.sp));
  let h='';for(let k=0;k<GM.slots;k++){const L=GM.lines.find(M=>M.col===LCOL[k]);h+=`<button class="lc${L?'':' empty'}${L&&GM.lines.indexOf(L)===selLine?' on':''}" style="--c:${LCOL[k]}" data-l="${LCOL[k]}" aria-label="${t('Hat','Line')} ${k+1}">${L?L.boats.length:'+'}</button>`}
  h+=`<span class="stk" title="${t('Boşta tekne','Spare boats')}">⛴ ${GM.stock}${GM.vap?' · 🚢 '+GM.vap:''}</span>`;$('lines').innerHTML=h;
  const L=GM.lines[selLine];$('lp').hidden=!L;if(L){$('lp').innerHTML=`<div class="lpt"><i style="background:${L.col}"></i><b>${L.piers.map(p=>PIERS[p].name).join(' – ')}</b></div>
   <div class="lpa"><button class="btn" data-a="bminus" ${L.boats.length<=1?'disabled':''}>− ${t('Tekne','Boat')}</button><button class="btn" data-a="bplus">+ ${t('Tekne','Boat')} ${GM.stock?'':'(₺'+BOATC+')'}</button>
   <button class="btn" data-a="vplus">+ ${t('Vapur','Ferry')} ${GM.vap?'':'(₺'+VAPC+')'}</button><button class="btn warn" data-a="ldel">${t('Hattı kaldır','Remove line')}</button></div>
   <p class="mut">${L.boats.length} ${t('tekne','boats')} · ${L.boats.reduce((a,b)=>a+b.cap,0)} ${t('koltuk','seats')} · ${t('Uçtan sürükleyerek uzat','Drag from an end to extend')}</p>`}
  const ad=GM.adDay===GM.day?GM.ads:0;$('adBtn').disabled=ad>=3;$('adBtn').textContent='📺 +₺500'+(ad?` (${3-ad})`:'')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.w){reward(b.dataset.w);return}
  if(b.dataset.sp!==undefined){const s=+b.dataset.sp;if(s===0)paused=true;else{paused=false;speed=s}ui();return}
  if(b.dataset.l){const li=GM.lines.findIndex(M=>M.col===b.dataset.l);if(li>=0)selLine=selLine===li?-1:li;else{selLine=-1;toast(t('Yeni hat için bir iskeleden diğerine sürükle','Drag from one pier to another to draw a new line'))}ui();return}
  const a=b.dataset.a,L=GM&&GM.lines[selLine];
  if(a==='bplus'&&L){if(GM.stock>0)GM.stock--;else if(GM.money>=BOATC)GM.money-=BOATC;else{toast(t('Yeterli para yok','Not enough cash'));return}const nb=newBoat(L);nb.si=0;nb.s=0;L.boats.push(nb)}
  if(a==='vplus'&&L){if(GM.vap>0)GM.vap--;else if(GM.money>=VAPC)GM.money-=VAPC;else{toast(t('Yeterli para yok','Not enough cash'));return}const nb=newBoat(L,true);L.boats.push(nb)}
  if(a==='bminus'&&L&&L.boats.length>1){const b2=L.boats.pop();if(b2.big)GM.vap++;else GM.stock++;for(const x of b2.pax){const p=L.piers[b2.si];(GM.q[p]=GM.q[p]||[]).push(x)}}
  if(a==='ldel'&&L){for(const b2 of L.boats){if(b2.big)GM.vap++;else GM.stock++;for(const x of b2.pax){const p=L.piers[b2.si];(GM.q[p]=GM.q[p]||[]).push(x)}}GM.lines.splice(selLine,1);selLine=-1}
  if(a==='new'){startGame(true);return}if(a==='cont'){startGame(false);return}if(a==='menu'){showStart();return}
  if(a==='pause'){paused=true;showStart();return}
  if(a==='ad'){if(GM.adDay!==GM.day){GM.adDay=GM.day;GM.ads=0}if(GM.ads>=3)return;paused=true;$('mB').innerHTML=`<div class="adv"><small>${t('Sponsor','Sponsor')}</small><h2>Boğaz Taksi</h2><p>${t('Kendi deniz taksini sür! App Store ve Google Play’de.','Drive your own water taxi! On the App Store and Google Play.')}</p><p class="mut" id="adc">5</p></div>`;$('m').hidden=false;
    let n=5;const iv=setInterval(()=>{n--;const c=$('adc');if(c)c.textContent=n;if(n<=0){clearInterval(iv);GM.ads++;GM.money+=500;$('m').hidden=true;paused=false;toast(t('Ödül: +₺500','Reward: +₺500'));ui()}},1000);return}
  if(a==='lang'){LANG=LANG==='en'?'tr':'en';try{localStorage.setItem('bf2-lang',LANG)}catch(_){}applyStaticLang();showStart();return}
  ui();save()});

/* ---------- Dokunma: iskeleden sürükle = hat çiz, boşluktan sürükle = haritayı kaydır ---------- */
const toW=(sx,sy)=>({x:cam.x+(sx-cw/2)/z,y:cam.y+(sy-ch/2)/z});
function pierAt(w){let best=-1,bd=Math.max(26,30/z);for(const i of GM.open){const p=PIERS[i],d=Math.hypot(p.wx-w.x,p.wy-w.y);if(d<bd){bd=d;best=i}}return best}
const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{if(!GM||paused&&!$('start').hidden)return;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z};drag=null;return}
  const w=toW(e.clientX,e.clientY),p=pierAt(w);
  if(p>=0){const li=GM.lines.findIndex(L=>L.piers[0]===p||L.piers[L.piers.length-1]===p);
    if(li>=0&&(selLine===li||GM.lines.filter(L=>L.piers[0]===p||L.piers[L.piers.length-1]===p).length===1)){const L=GM.lines[li];drag={kind:'line',li,end:L.piers[0]===p&&L.piers.length>1&&L.piers[L.piers.length-1]!==p?'a':(L.piers[L.piers.length-1]===p?'b':'a')};selLine=li;ui();return}
    const col=LCOL.slice(0,GM.slots).find(c=>!GM.lines.some(L=>L.col===c));
    if(!col){toast(t('Boş hat yok — haftalık ödülle ya da ₺'+LINEC+' ile ruhsat al','No free line — earn one weekly or buy for ₺'+LINEC));drag={kind:'pan',x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};return}
    const L={piers:[p],col,boats:[],pts:[],cum:[0],len:0,stops:[0]};GM.lines.push(L);drag={kind:'line',li:GM.lines.length-1,end:'b',fresh:true};selLine=drag.li;return}
  drag={kind:'pan',x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:0}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];z=clamp(pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,.28,2.2);return}
  if(!drag)return;
  if(drag.kind==='pan'){drag.moved=Math.max(drag.moved||0,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));cam.x=clamp(drag.cx-(e.clientX-drag.x)/z,0,W);cam.y=clamp(drag.cy-(e.clientY-drag.y)/z,0,H);return}
  const w=toW(e.clientX,e.clientY);drag.wx=w.x;drag.wy=w.y;const L=GM.lines[drag.li],p=pierAt(w);
  if(p>=0&&!L.piers.includes(p)){if(drag.end==='a')L.piers.unshift(p);else L.piers.push(p);
    if(L.piers.length===2&&!L.boats.length){if(GM.stock>0){GM.stock--;L.boats.push(newBoat(L))}else if(GM.vap>0){GM.vap--;L.boats.push(newBoat(L,true))}else toast(t('Boşta tekne yok — hat panelinden tekne al','No spare boat — buy one in the line panel'))}
    if(drag.end==='a')L.boats.forEach(b=>b.si++);rebuild(L);ui()}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!drag)return;
  if(drag.kind==='line'){const L=GM.lines[drag.li];if(L&&L.piers.length<2){GM.lines.splice(drag.li,1);selLine=-1}save()}
  else if(drag.kind==='pan'&&(drag.moved||0)<6&&selLine>=0){selLine=-1}
  drag=null;ui()};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();const w0=toW(e.clientX,e.clientY);z=clamp(z*Math.exp(-e.deltaY*.0015),.28,2.2);const w1=toW(e.clientX,e.clientY);cam.x+=w0.x-w1.x;cam.y+=w0.y-w1.y},{passive:false});
document.addEventListener('keydown',e=>{if(e.key===' '&&GM&&$('start').hidden&&$('m').hidden){e.preventDefault();paused=!paused;ui()}});

/* ---------- Başlangıç ---------- */
function showStart(){paused=true;save();const sv=localStorage.getItem(SAVE),best=+(localStorage.getItem(BEST)||0);
  document.body.classList.toggle('menu',!GM);$('sB').innerHTML=`<small class="kick">${t('İSTANBUL · BOĞAZ VE HALİÇ','ISTANBUL · BOSPHORUS & GOLDEN HORN')}</small><h1>${t('Boğaz Filosu','Bosphorus Fleet')}</h1>
   <p>${t('İskeleden iskeleye parmağınla hat çiz, teknelerini yerleştir, yolcular birikmeden taşı. İskeleler hafta hafta açılıyor.','Draw ferry lines from pier to pier, place your boats and carry passengers before the piers overflow. New piers open week by week.')}</p>
   <ul class="how"><li><b>●</b> ${t('Konut','Homes')} <b>■</b> ${t('İş','Work')} <b>▲</b> ${t('Turistik','Sights')} — ${t('yolcular o şekildeki bir iskeleye gitmek ister','passengers want a pier of that shape')}</li>
   <li>${t('Bir iskele 10 yolcuyu aşıp kırmızı halka dolarsa oyun biter','If a pier passes 10 passengers and its red ring fills, the game ends')}</li></ul>
   <div class="sa">${sv?`<button class="btn pri" data-a="cont">${t('Devam et','Continue')}</button>`:''}<button class="btn ${sv?'':'pri'}" data-a="new">${t('Yeni oyun','New game')}</button></div>
   <p class="mut">${best?t('En iyi skor: ','Best: ')+best+' · ':''}<button class="link" data-a="lang">${LANG==='en'?'Türkçe':'English'}</button> · <a href="bogaz_filosu.html">${t('Eski sürüm (v3)','Old version (v3)')}</a></p>`;$('start').hidden=false}
function startGame(nw){if(nw){GM=fresh();try{localStorage.removeItem(SAVE)}catch(_){}}else GM=load()||fresh();selLine=-1;z=clamp(Math.min(cw,ch)/620,.45,1.3);cam={x:960,y:2400};
  document.body.classList.remove('menu');$('start').hidden=true;$('m').hidden=true;paused=false;speed=1;ui();if(nw)toast(t('Karaköy’den Üsküdar’a sürükleyerek ilk hattını çiz','Drag from Karaköy to Üsküdar to draw your first line'))}

/* ---------- Döngü ---------- */
function resize(){const r=cv.getBoundingClientRect();cw=r.width;ch=r.height;const d=Math.min(devicePixelRatio||1,2);cv.width=Math.round(cw*d);cv.height=Math.round(ch*d);dpr=cv.width/cw}
addEventListener('resize',resize);resize();
let last=performance.now(),lastDraw=0,uiT=0;
function frame(now){requestAnimationFrame(frame);if(now-lastDraw<(paused?66:31))return;lastDraw=now;const dt=Math.min(.1,(now-last)/1000);last=now;
  if(GM&&!paused&&GM.over===null){for(let k=0;k<speed;k++)step(dt)}else time+=dt*.5;
  for(const P of pops)P.t-=dt;pops=pops.filter(P=>P.t>0);if(pingT>0)pingT-=dt;
  if(GM)draw();else{const day=getDayFactor(),pal=getPalette(day);sc=z;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=pal.land;ctx.fillRect(0,0,cw,ch);ctx.setTransform(dpr*z,0,0,dpr*z,dpr*(cw/2-cam.x*z),dpr*(ch/2-cam.y*z));const v={x0:cam.x-cw/2/z,x1:cam.x+cw/2/z,y0:cam.y-ch/2/z,y1:cam.y+ch/2/z};drawMapA(v,pal,day,day>.65);drawMapB(v,pal,day,day>.65)}
  uiT+=dt;if(uiT>.5&&GM){uiT=0;ui()}}
try{const l=localStorage.getItem('bf2-lang');if(l==='en'||l==='tr')LANG=l}catch(_){}
z=clamp(Math.min(cw,ch)/620,.45,1.3);GM=null;showStart();requestAnimationFrame(frame);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(GM&&$('start').hidden)paused=true;ui()}});

</script>
