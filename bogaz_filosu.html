const lineKm=l=>{let s=0;for(let i=0;i<l.stops.length-1;i++)s+=kmOf(l.stops[i],l.stops[i+1]);return s};
function lineMarks(l){if(l.marks!=null)return l.marks;const pts=[];for(let i=0;i<l.stops.length-1;i++)pts.push(...pathBetween(l.stops[i],l.stops[i+1]).pts);
  const near=MARKS.filter(m=>{for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],dx=b[0]-a[0],dz=b[1]-a[1],L=dx*dx+dz*dz||1,q=clamp(((m.x-a[0])*dx+(m.z-a[1])*dz)/L,0,1);if(Math.hypot(a[0]+dx*q-m.x,a[1]+dz*q-m.z)<210)return true}return false});
  return l.marks=Math.min(5,near.length+(pts.some(p=>Math.hypot(p[0]-KIZ.x,p[1]-KIZ.z)<260)?1:0))}

const tod=h=>h<5?.08:h<6?.25:h<7?.6:h<10?1.7:h<16?.8:h<17?1.1:h<20?1.8:h<23?.7:.25;

// Sabah Anadolu'dan Avrupa'ya, akşam Avrupa'dan Anadolu'ya işe gidiş-dönüş akışı

function demandTick(dtg){const h=hour(),base=.62*tod(h)*mods.demand*(.8+S.rep/250)*dtg/3600,served={},keep=Math.exp(-dtg/5400); // beklemekten sıkılan yolcu yavaşça gider
  for(const l of S.lines){const nb=S.boats.filter(b=>b.lineId===l.id).length;if(!nb)continue;
    if(l.kind==='tur'){const tb=2.4*tourTod(h)*mods.tour*dtg/3600*clamp(1.9-.9*l.price,.2,1.5)*(1+.08*lineMarks(l));
      for(let i=0;i<l.stops.length;i++){l.wait[i][i]*=keep;if(closed(l.stops[i]))continue;const p=PIERS[l.stops[i]];if(l.wait[i][i]<220)l.wait[i][i]+=tb*(p.tour?1:.35)*(p.pop/6+.5)*tourSurge(l.stops[i])}continue}

    for(let i=0;i<l.stops.length;i++){const ai=l.stops[i],a=PIERS[ai];if(closed(ai))continue;let tot=0;for(let j=0;j<l.stops.length;j++)tot+=l.wait[i][j];
      for(let j=0;j<l.stops.length;j++){if(i===j)continue;l.wait[i][j]*=keep;const bj=l.stops[j],b=PIERS[bj];if(closed(bj))continue;served[ai*100+bj]=1;
        let r=base*pm*Math.sqrt(pw(a)*pw(b))*(a.side!==b.side?1.35:1)*dirF(a,b,h)*surgeMult(ai,bj,h);

function setPath(b,to){b.path=pathBetween(b.at,to);b.pd=0;b.to=to}

  b.mt='go';b.mty=best;b.load={};if(b.path)b.pend=true;if(!quiet)toast(b.name+t((b.mtw.k==='maint'?' bakım':' tersane işi')+' için '+PIERS[best].name+' tersanesine gidiyor',' heads to the '+PIERS[best].name+' shipyard'));return true}
function arrive(b){if(b.pend){b.pend=false;return}
  if(b.mode==='line'&&!b.mt){const l=S.lines.find(x=>x.id===b.lineId);if(!l||b.li==null||l.stops[b.li]!==b.at)return;const last=l.stops.length-1;

      if(b.li+b.dirn<0||b.li+b.dirn>last)b.dirn=-b.dirn;
      const n=Math.min(capOf(b)-(b.load.tur||0),Math.floor(l.wait[b.li][b.li]));if(n>0){l.wait[b.li][b.li]-=n;b.load.tur=(b.load.tur||0)+n;const inc=Math.round(n*tourFare(l)*mods.tourPay);earn('tur',inc);l.inc=(l.inc||0)+inc}

function decide(b){

  if(b.mode==='line'){const l=S.lines.find(x=>x.id===b.lineId);if(!l){b.mode='idle';b.lineId=0;return}
    if(b.li==null||l.stops[b.li]!==b.at){let best=0,bd=1e9;l.stops.forEach((s,i)=>{const d=Math.hypot(NODES[s][0]-NODES[b.at][0],NODES[s][1]-NODES[b.at][1]);if(d<bd){bd=d;best=i}});

function tick(dtg){S.t+=dtg;const d=Math.floor(S.t/DAY)+1;if(!S.day)S.day=d;if(d!==S.day){endDay();S.day=d}
  calcMods();demandTick(dtg);
  for(const j of S.jobs)if(j.exp<S.t)j.dead=1;S.jobs=S.jobs.filter(j=>!j.dead);
  contractTick();
  if(S.t>=S.nextJob){genJob();S.nextJob=S.t+rnd(700,1700)/Math.max(1,mods.tour*.7)}
  if(S.t>=S.nextEvent){fireEvent();S.nextEvent=S.t+rnd(9000,20000)*D().ev}
  if(S.t>=S.nextSurge){genSurge();S.nextSurge=S.t+rnd(4*3600,8*3600)}
  if(S.t>=S.rival.nextOpen){rivalOpen();S.rival.nextOpen=S.t+DAY*rnd(.8,1.6)*D().rival}
  npcTick(dtg);for(const b of S.boats)moveBoat(b,dtg)}

function renderStart(){const d=DIFF[stDiff],cur=DIFF[S.diff]||DIFF.orta,pct=v=>(v>=1?'+':'−')+Math.round(Math.abs(v-1)*100)+'%';
  let h=`<div class="st-top"><div><div class="st-ticket"><span>${t('İstanbul','Istanbul')}</span><span>·</span><span>${t('Boğaz ve Haliç','Bosphorus & Golden Horn')}</span></div>
    <h1 id="stTitle">${t('Boğaz Filosu','Bosphorus Fleet')}</h1><p class="st-sub">${t('Kendi deniz taşımacılığı şirketini kur: hatlar aç, tekne al, kaptan tut, sözleşmeleri yetiştir ve rakibinden yolcu kap.','Build your own ferry company: open lines, buy boats, hire captains, deliver contracts and win riders from your rival.')}</p></div>
    <div class="seg" role="group" aria-label="Dil / Language"><button data-sl="tr" aria-pressed="${LANG==='tr'}" ${LANG==='tr'?'class="on"':''}>TR</button><button data-sl="en" aria-pressed="${LANG==='en'}" ${LANG==='en'?'class="on"':''}>EN</button></div></div>`;
  h+=`<div class="st-h">${t('Zorluk','Difficulty')}</div><div class="diffs">`;
  for(const k in DIFF){const q=DIFF[k];h+=`<button class="diff ${k}" data-d="${k}" aria-pressed="${k===stDiff}"><b>${L2(q.n)}</b><span>${L2(q.d)}</span><i>${t('Sermaye','Capital')} ${tl(q.cash)}</i></button>`}
  h+=`</div><p class="st-info">${t('Kazanç','Earnings')} <b>${d.pay===1?'±0%':pct(d.pay)}</b> · ${t('Masraflar','Costs')} <b>${d.cost===1?'±0%':pct(d.cost)}</b> · ${t('Yıpranma','Wear')} <b>${d.wear===1?'±0%':pct(d.wear)}</b> · ${t('Tekne atama süresi','Time to assign')} <b>${String(d.grace/3600).replace('.',LANG==='tr'?',':'.')} ${t('sa','h')}</b> · ${t('İflas','Bankrupt after')} <b>${d.neg} ${t('gece eksi',d.neg>1?'nights in the red':'night in the red')}</b></p>`;
  h+=`<div class="st-btns">`;
  if(stHasSave)h+=`<button class="btn pri" id="stCont">${t('Devam et','Continue')} · ${t((Math.floor(S.t/DAY)+1)+'. gün','Day '+(Math.floor(S.t/DAY)+1))} · ${L2(cur.n)} · ${tlc(S.cash)}</button>`;
  h+=`<button class="btn ${stHasSave?'':'pri'}" id="stNew">${stArm?t('Eminim, yeni oyuna başla','Yes, start a new game'):t('Yeni oyun','New game')} · ${L2(d.n)}</button>`;
  if(stArm)h+=`<p class="st-note">${t('Kayıtlı oyunun silinecek. Rozetlerin kalır.','Your saved game will be erased. Badges are kept.')}</p>`;
  h+=`</div>`;$('stBox').innerHTML=h}
$('stBox').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.d){stDiff=b.dataset.d;stArm=false;renderStart();const n=$('stBox').querySelector(`[data-d="${stDiff}"]`);if(n)n.focus();return}
  if(b.dataset.sl){LANG=b.dataset.sl;try{localStorage.setItem('bogaz-filosu-lang',LANG)}catch(_){}applyLang();render();hud(true);return}
  if(b.id==='stCont'){closeStart();return}
  if(b.id==='stNew'){if(stHasSave&&!stArm){stArm=true;renderStart();return}restart(stDiff);closeStart();speed=1;hud(true)}});
$('menuB').addEventListener('click',openStart);

/* ---------- Başlat ---------- */
load();theme();resize();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',theme);
new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
addEventListener('resize',resize);
if(S.dead)restart();if(S.lines.length)tab='';openStart();
applyLang();
let last=performance.now(),uiT=0,autoT=0,saveT=0;
function frame(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;
  if(speed&&!S.dead){let g=dt*GSEC*speed;while(g>0){const s=Math.min(g,30);tick(s);g-=s}
    autoT+=dt*speed;if(autoT>.5){autoT=0;autoAssign();checkGoals();checkAch()}}
  uiT+=dt;if(uiT>1){uiT=0;const ae=document.activeElement;if(tab&&!(ae&&ae.tagName==='SELECT'))render();else if(bwId)renderBW();if(sel)renderInfo()}
  saveT+=dt;if(saveT>10){saveT=0;save()}
  if(uiT===0)renderOffer();
  hud();draw();requestAnimationFrame(frame)}
newsNext();requestAnimationFrame(frame);
})();
</script>
