<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2f8fe6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bosphorus Drift" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bosphorus Drift" />
    <meta property="og:description" content="İstanbul'da kart yarışı: Galata, Kapalıçarşı ve Boğaz pistleri, 8 yarışçı." />
    <meta property="og:url" content="https://dogancansk-cloud.github.io/visuals/bosphorus-drift/" />
    <meta property="og:image" content="https://dogancansk-cloud.github.io/visuals/bosphorus-drift/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dogancansk-cloud.github.io/visuals/bosphorus-drift/og.jpg" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <meta name="description" content="Bosphorus Drift: İstanbul'da geçen kart yarışı. Galata, Kapalıçarşı ve Boğaz pistleri, 8 yarışçı, drift turbosu, martı, çay ve nazar boncuğu." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%232f6fb3'/%3E%3Ccircle cx='16' cy='16' r='10' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%237ec0f0'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23191e2d'/%3E%3C/svg%3E" />
    <title>Bosphorus Drift</title>
    <link rel="stylesheet" href="./src/style.css" />
    <script data-goatcounter="https://dogancansk.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="ui">
        <div id="hud" class="hide">
          <div id="pos"><small>SIRA</small><b>1</b><span>/8</span></div>
          <div id="spd"><b>0</b><small>KM/S</small></div>
          <div id="topr"><div id="lap">TUR 1/3</div><div id="time">0:00.00</div></div>
          <div id="itembox"><div id="item"></div></div>
          <div id="simit"><i></i><b>0</b></div>
          <canvas id="mini" width="150" height="150"></canvas>
          <div id="drift" class="hide"><div class="bar"><div class="zone"></div><div class="fill"></div></div><div class="pips"><i></i><i></i><i></i></div></div>
          <div id="msg"></div>
          <div id="count"></div>
          <div id="wrong" class="hide">TERS YÖN!</div>
          <button id="pauseBtn" aria-label="Duraklat">❚❚</button>
        </div>
        <div id="touch" class="hide">
          <div id="tSteer"><div id="tKnob"></div><span class="hint">← sürükle →</span></div>
          <button id="tGas">GAZ</button>
          <button id="tItem">EŞYA</button>
          <button id="tBrake">FREN</button>
          <button id="tDrift">DRİFT</button>
        </div>
        <div id="menu"></div>
        <div id="loading"><div class="logo">BOSPHORUS<br />DRIFT</div><div class="lbar"><i></i></div><p><b id="lpct">%0</b> <span id="ltxt">Pist hazırlanıyor…</span></p></div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
