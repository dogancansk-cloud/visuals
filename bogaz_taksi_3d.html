<style>

<script type="module">
import * as THREE from 'three';

/* ================= Dil (TR/EN) ================= */
const $=id=>document.getElementById(id);
let LANG='tr';try{LANG=localStorage.getItem('bt3d-lang')||((navigator.language||'tr').startsWith('tr')?'tr':'en')}catch(_){}
const TX={
  tr:{load:'Boğaz yükleniyor…',pier:'İskele',touch:'Sürmek için ekrana dokun ve sürükle. İskelenin beyaz halkasında yavaşla, iş al.',keys:'Ok tuşları veya WASD ile sür. İskelenin beyaz halkasında yavaşla, iş al.',back:'Geri',fail:'3B görüntü bu cihazda açılamadı. <a href="bogaz_taksi.html">2B Boğaz Taksi</a> her cihazda çalışır.'},
  en:{load:'Loading the Bosphorus…',pier:'Pier',touch:'Touch and drag to steer. Slow down in a pier’s white ring to take a job.',keys:'Steer with arrow keys or WASD. Slow down in a pier’s white ring to take a job.',back:'Back',fail:'3D view could not start on this device. <a href="bogaz_taksi.html">2D Boğaz Taksi</a> works everywhere.'}
};
const T=k=>TX[LANG][k];
const TOUCH=matchMedia('(pointer:coarse)').matches;
function applyLang(){document.documentElement.lang=LANG;$('lang').textContent=LANG==='tr'?'EN':'TR';$('loadT').textContent=T('load');$('pierK').textContent=T('pier');$('hint').textContent=T(TOUCH?'touch':'keys');$('back').setAttribute('aria-label',T('back'));$('failT').innerHTML=T('fail')}
applyLang();
$('lang').onclick=()=>{LANG=LANG==='tr'?'en':'tr';try{localStorage.setItem('bt3d-lang',LANG)}catch(_){}applyLang();try{hudUp();renderGoals();renderJob();renderOffers();renderStart();$('tow').hidden=true;fuelUi();lmLabels()}catch(_){}};

/* ================= Ses (2B Boğaz Taksi'nin ses motoru; müzik yok, deniz ortam sesi) ================= */
/* ---------- Ses efektleri (tek ses motoru, ilk dokunuşta açılır) ---------- */
const SND_KEY='bt3d-sound';
let SND_ON=true;try{if(localStorage.getItem(SND_KEY)==='0')SND_ON=false}catch(_){}
const SFX=(()=>{let ac=null,master=null,eng=null,nb=null;
  document.addEventListener('visibilitychange',()=>{if(!ac)return;try{document.hidden?ac.suspend():ac.resume()}catch(_){}}); // arka planda ses motoru durur
  function init(){if(ac)return ac;const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;
    try{ac=new A();master=ac.createGain();master.gain.value=SND_ON?.8:0;master.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate*.5|0,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(_){ac=null}
    return ac}
  const ok=()=>SND_ON&&init()&&ac.state!=='closed';
  function env(g,t0,a,pk,dur){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(pk,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+dur)}
  function tone(type,f,t0,dur,pk,f2,dest){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
    env(g,t0,Math.min(.03,dur/4),pk,dur);o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+.05)}
  function lp(f){const x=ac.createBiquadFilter();x.type='lowpass';x.frequency.value=f;x.connect(master);return x}
  return{
    resume(){const a=init();if(a&&a.state==='suspended')a.resume().catch(()=>{});if(a)MUS.boot(a)},
    setOn(v){SND_ON=v;if(master)master.gain.setTargetAtTime(v?.8:0,ac.currentTime,.05);if(v)this.resume()},
    bell(){if(!ok())return;const n=ac.currentTime;[0,.22].forEach(o=>{tone('sine',880,n+o,.55,.2);tone('triangle',1318.5,n+o,.55,.12)})},
    depart(){if(!ok())return;const n=ac.currentTime,f=lp(1500); // taksi teknesinin "düt düt" kornası
      [0,.24].forEach(o=>{tone('square',392,n+o,.17,.08,0,f);tone('square',494,n+o,.17,.06,0,f)})},
    horn(kind){if(!ok())return;const n=ac.currentTime,big=kind!=='ferry',f=lp(big?420:650),base=big?73:110,dur=big?2.2:1.5,pk=.22; // vapur/tanker düdüğü
      [1,1.26,1.5].forEach((m,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=base*m;
        g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(pk/(i+1),n+.12);g.gain.setValueAtTime(pk/(i+1),n+dur-.25);g.gain.linearRampToValueAtTime(.0001,n+dur);
        o.connect(g);g.connect(f);o.start(n);o.stop(n+dur+.05)})},
    coin(m){if(!ok())return;const n=ac.currentTime;(m>1?[784,988,1175,1568]:[988,1319]).forEach((fr,i)=>tone('triangle',fr,n+i*.07,.22,.15))},
    upgrade(){if(!ok())return;const n=ac.currentTime;[523,659,784,1047,1319].forEach((fr,i)=>tone('triangle',fr,n+i*.06,.3,.13));[2093,2637,3136].forEach((fr,i)=>tone('sine',fr,n+.32+i*.05,.25,.05))},
    late(){if(!ok())return;const n=ac.currentTime;tone('triangle',392,n,.25,.13);tone('triangle',311,n+.18,.35,.13)},
    crash(){if(!ok()||!nb)return;const n=ac.currentTime,s=ac.createBufferSource(),f=lp(500),g=ac.createGain();s.buffer=nb;env(g,n,.01,.5,.4);s.connect(g);g.connect(f);s.start(n);s.stop(n+.45);tone('sine',90,n,.35,.3,45)},
    ach(){if(!ok())return;const n=ac.currentTime;[523,659,784,1047].forEach((fr,i)=>{tone('triangle',fr,n+i*.11,.35,.14);tone('sine',fr*2,n+i*.11,.3,.035)})},
    gull(){if(!ok())return;const n=ac.currentTime,k=2+(Math.random()*2|0);for(let i=0;i<k;i++)tone('sine',1650+Math.random()*350,n+i*.2,.16,.035,950)},
    engine(level,pitch){if(!SND_ON||!ac||ac.state!=='running')return; // sürekli motor uğultusu: yumuşak dizel, sabit seyirde kendiliğinden kısılır
      if(!eng){const o=ac.createOscillator(),o2=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain(),am=ac.createGain();
        o.type='triangle';o2.type='sine';f.type='lowpass';f.Q.value=.4;f.frequency.value=180;g.gain.value=0;am.gain.value=1;lfo.type='sine';lfo.frequency.value=6;lg.gain.value=.22;
        lfo.connect(lg);lg.connect(am.gain);o.connect(f);o2.connect(f);f.connect(am);am.connect(g);g.connect(master);o.start();o2.start();lfo.start();eng={o,o2,f,g,lfo,steady:0,lp:pitch,ll:level,lt:ac.currentTime}}
      const t0=ac.currentTime,dt=Math.min(.25,t0-eng.lt);eng.lt=t0;
      if(Math.abs(pitch-eng.lp)>4||Math.abs(level-eng.ll)>.012){eng.steady=0;eng.lp=pitch;eng.ll=level}else eng.steady+=dt;
      const calm=eng.steady<12?1:Math.max(.3,1-(eng.steady-12)/6*.7);
      eng.g.gain.setTargetAtTime(level*.5*calm,t0,eng.steady>12?.8:.15);
      eng.o.frequency.setTargetAtTime(pitch*.5,t0,.2);eng.o2.frequency.setTargetAtTime(pitch,t0,.2);
      eng.f.frequency.setTargetAtTime(140+pitch*1.4,t0,.25);eng.lfo.frequency.setTargetAtTime(3+pitch/16,t0,.3)}
  }})();
/* ---------- Boğaz ortam sesi (müzik yok): dalga, iskele çalkantısı, uzak martı ve vapur, rüzgâr ---------- */
let ECO=false;try{ECO=localStorage.getItem('bt-eco')==='1'}catch(_){}
const MUS_KEY='bt3d-amb';let MUS_ON=true;try{if(localStorage.getItem(MUS_KEY)==='0')MUS_ON=false}catch(_){}
const MUS=(()=>{let ac=null,bus=null,timer=null,wind=null,nextGull=0,nextHorn=0,nextLap=0,lapBuf=null;
  function noise(sec,brown){const L=ac.sampleRate*sec|0,b=ac.createBuffer(2,L,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);let p=0;
    for(let i=0;i<L;i++){const w=Math.random()*2-1;if(brown){p=p*.985+w*.015;d[i]=p*9}else d[i]=w}}return b}
  function loop(buf,type,freq,q,gain){const s=ac.createBufferSource();s.buffer=buf;s.loop=true;s.loopStart=Math.random();const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||.7;
    const g=ac.createGain();g.gain.value=gain;s.connect(f);f.connect(g);g.connect(bus);s.start();return{s,f,g}}

  for(const p of PIERS)avoid.push([p.x,p.z,26]);
  for(const L of LM)if(L.r)avoid.push([L.x,L.z,L.r]);
  avoid.push([811,2262,70]); // Galataport rıhtımı
  for(const b of BRIDGES)for(const e of [[b.p[0],b.p[1]],[b.p[2],b.p[3]]])avoid.push([e[0],e[1],b.k==='s'?40:26]);
  const SP=TOUCH?14:12;
  for(let z=-500;z<3600;z+=SP)for(let x=-450;x<2450;x+=SP){
    const gi=Math.round((x+450)/SP),gj=Math.round((z+500)/SP),jx=x+(hsh(gi,gj)-.5)*SP*.5,jz=z+(hsh(gj,gi+7)-.5)*SP*.5;
    const d=sdf(jx,jz);if(d<7||d>280)continue;
    if(avoid.some(a=>Math.hypot(jx-a[0],jz-a[1])<a[2]))continue;
    const n=vnoise(jx/120,jz/120),u=urban(jx,jz),coast=clamp(1-(d-7)/(30+90*n),0,1)*(n>.28?.9:.15);
    const p=Math.max(u*.92,coast),r=hsh(gi*1.7,gj*3.1);
    if(r<p){const city=u>coast;HOUSES.push({x:jx,z:jz,d,city,s:hsh(gi,gj*5)});occ.add(gi+','+gj)}
    else if(d>14){const f=vnoise(jx/200+9,jz/200);if(r<clamp((f-.38)*1.7,0,.75)*(1-u))TREES.push({x:jx,z:jz,s:hsh(gi*5,gj)})}
  }
  // evler: duvar + kiremit çatı (anlık örnekleme ile tek çizim)
  const wallG=new THREE.BoxGeometry(1,1,1);wallG.translate(0,.5,0);
  const roofG=new THREE.ConeGeometry(.74,1,4,1);roofG.rotateY(Math.PI/4);roofG.translate(0,.5,0);
  const walls=new THREE.InstancedMesh(wallG,lam('#ffffff'),HOUSES.length),roofs=new THREE.InstancedMesh(roofG,lam('#ffffff'),HOUSES.length);
  const WALLC=['#efe6d2','#f4efe4','#e8c98f','#e7b8a4','#d9a072','#f0dca6','#c9d4d2','#e2d4bd','#b9a48a','#f2e2c6'].map(c=>new THREE.Color(c));
  const ROOFC=['#b2553a','#a24a32','#c0663f','#8e4a36','#9a5b44'].map(c=>new THREE.Color(c));
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),v=new THREE.Vector3(),sc=new THREE.Vector3();let nr=0;
  HOUSES.forEach((h,i)=>{const g=grad(h.x,h.z),a=Math.atan2(g.x,g.z)+(h.s-.5)*.3;
    const ground=Math.min(hgt(h.x,h.z,h.d),hgt(h.x+5,h.z+5),hgt(h.x-5,h.z-5))-1.5;
    let w,dd,hh;if(h.city){w=10+h.s*7;dd=9+hsh(h.s,3)*7;hh=9+hsh(h.s,5)*(h.d<40?14:22)}else{w=8+h.s*6;dd=7+hsh(h.s,3)*5;hh=6+hsh(h.s,5)*6+(h.d<18?2:0)}
    e.set(0,a,0);q.setFromEuler(e);v.set(h.x,ground,h.z);sc.set(w,hh+1.5,dd);m.compose(v,q,sc);walls.setMatrixAt(i,m);
    if(hsh(i,9)<.7){const n=h.city?2:1;for(let k=0;k<n;k++){const lat=(hsh(i,11+k)-.5)*w*.6,up=ground+1.5+hh*(.35+.45*hsh(i,13+k)),ox=-g.x*(dd/2+.5)+Math.cos(a)*lat,oz=-g.z*(dd/2+.5)-Math.sin(a)*lat;WIN.push(h.x+ox,up,h.z+oz)}}
    walls.setColorAt(i,WALLC[(hsh(i,1)*WALLC.length)|0]);
    if(!h.city||hsh(i,2)<.35){v.y=ground+hh+1.5;sc.set(w*1.05,3+w*.22,dd*1.05);m.compose(v,q,sc);roofs.setMatrixAt(nr,m);roofs.setColorAt(nr,ROOFC[(hsh(i,4)*ROOFC.length)|0]);nr++}
  });
  roofs.count=nr;scene.add(walls,roofs);
  {const wg=new THREE.BufferGeometry();wg.setAttribute('position',new THREE.Float32BufferAttribute(WIN,3));
   NLIGHT=new THREE.Points(wg,new THREE.PointsMaterial({color:'#ffd58a',size:2.6,sizeAttenuation:true,transparent:true,opacity:0,depthWrite:false}));NLIGHT.visible=false;scene.add(NLIGHT)}
  // ağaçlar
  const treeG=new THREE.IcosahedronGeometry(1,0);treeG.translate(0,1,0);
  const trees=new THREE.InstancedMesh(treeG,lam('#ffffff'),TREES.length);
  const TC=['#4d6b37','#5a7a3d','#3f5d30','#6b8744'].map(c=>new THREE.Color(c));
  TREES.forEach((t,i)=>{const r=4+t.s*4;v.set(t.x,hgt(t.x,t.z)-1,t.z);e.set(t.s*3,t.s*6,0);q.setFromEuler(e);sc.set(r,r*(1.1+t.s*.5),r);m.compose(v,q,sc);trees.setMatrixAt(i,m);trees.setColorAt(i,TC[(t.s*4)|0])});
  scene.add(trees);
}

function span(x,z,dx,dz){const a=march(x,z,dx,dz),b=march(x,z,-dx,-dz);return[a.x+a.dx*8,a.z+a.dz*8,b.x+b.dx*8,b.z+b.dz*8]}
const BRIDGES=[
 {n:'Yavuz Sultan Selim Köprüsü',k:'s',p:span(1481,120,1,0)},
 {n:'Fatih Sultan Mehmet Köprüsü',k:'s',p:span(1348,1310,1,0)},
 {n:'15 Temmuz Şehitler Köprüsü',k:'s',p:span(1178,1900,1,.1)},
 {n:'Galata Köprüsü',k:'g',p:span(726,2415,.33,-.94)},
 {n:'Atatürk Köprüsü',k:'g',p:span(655,2372,.45,-.89)},
 {n:'Haliç Köprüsü',k:'h',p:span(402,2148,.84,-.54)}
];
function buildBridge(b){
  const [x0,z0,x1,z1]=b.p,L=Math.hypot(x1-x0,z1-z0),ux=(x1-x0)/L,uz=(z1-z0)/L,phi=Math.atan2(uz,ux);
  const g=new THREE.Group();g.position.set(x0,0,z0);g.rotation.y=-phi;
  const W2L=(s,zl)=>[x0+s*ux-zl*uz,z0+s*uz+zl*ux];
  const steel=lam('#d9d4c8'),dark=lam('#5e5a55'),road=lam('#46423e');
  const box=(w,h,d,x,y,z,mat)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);g.add(o);return o};
  if(b.k==='s'){
    const H=46,ext=90,TL=H+44,tw=[8,L-8];
    box(L+2*ext,2.2,18,L/2,H,0,road);box(L+2*ext,3,15,L/2,H-2.4,0,steel);
    for(const tx of tw){const [wx,wz]=W2L(tx,0),base=Math.min(0,hgt(wx,wz))-4;
      for(const s of [-8,8])box(3.2,TL-base,3.2,tx,(TL+base)/2,s,steel);
      for(const y of [H-7,H+16,TL-2])box(2.4,2.4,19,tx,y,0,steel)}
    for(const s of [-8,8]){const pts=[];
      for(let i=0;i<=8;i++)pts.push(new THREE.Vector3(lerp(-ext,tw[0],i/8),lerp(H+1,TL,Math.pow(i/8,1.4)),s));
      const hs=(tw[1]-tw[0])/2,xm=(tw[0]+tw[1])/2;
      for(let i=1;i<40;i++){const x=lerp(tw[0],tw[1],i/40),q=(x-xm)/hs;pts.push(new THREE.Vector3(x,H+3+(TL-H-3)*q*q,s))}
      for(let i=0;i<=8;i++)pts.push(new THREE.Vector3(lerp(tw[1],L+ext,i/8),lerp(TL,H+1,1-Math.pow(1-i/8,1.4)),s));
      g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),90,.55,4),steel));
      const hp=[];for(let x=tw[0]+10;x<tw[1]-4;x+=10){const q=(x-xm)/hs;hp.push(x,H+1,s,x,H+3+(TL-H-3)*q*q,s)}
      const hg=new THREE.BufferGeometry();hg.setAttribute('position',new THREE.Float32BufferAttribute(hp,3));
      g.add(new THREE.LineSegments(hg,new THREE.LineBasicMaterial({color:'#e8e2d6',transparent:true,opacity:.75})))}
    for(const s of [-ext+20,L+ext-20,-ext+60,L+ext-60]){const [wx,wz]=W2L(s,0),gy=hgt(wx,wz)-3;box(5,H-gy,6,s,(H+gy)/2,0,steel)}
  }else{
    const H=b.k==='h'?15:9,ext=22,Wd=b.k==='g'?24:18;
    box(L+2*ext,2.4,Wd,L/2,H,0,road);box(L+2*ext,1.2,Wd+1.5,L/2,H-1.6,0,lam('#8c867c'));
    for(const s of [-1,1])box(L+2*ext,1,.6,L/2,H+1.6,s*(Wd/2-.3),steel);
    for(let s=20;s<L-10;s+=34){const [wx,wz]=W2L(s,0);if(sdf(wx,wz)>-2)continue;
      for(const zl of [-Wd/3,Wd/3]){const o=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.2,H+6,8),dark);o.position.set(s,H/2-3,zl);g.add(o);const [ox,oz]=W2L(s,zl);OBST.push({x:ox,z:oz,r:5})}}
    if(b.k==='g'){for(let s=12;s<L;s+=26)for(const zl of [-Wd/2+1,Wd/2-1]){const lp=box(.4,7,.4,s,H+4.5,zl,dark);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.55,6,4),new THREE.MeshBasicMaterial({color:'#ffe6b0'}));bulb.position.set(s,H+8,zl);g.add(bulb)}}
  }
  scene.add(g);
}

// Kit: bir yapının bütün parçalarını tek parçada birleştirir (telefonda hızlı çizilsin diye)
const LMAT=new THREE.MeshLambertMaterial({color:'#ffffff',vertexColors:true,flatShading:true});
function Kit(){const P=[],C=[],col=new THREE.Color(),m=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),v=new THREE.Vector3(),one=new THREE.Vector3(1,1,1);
  const K={add(geo,c,x=0,y=0,z=0,ry=0){const g=geo.index?geo.toNonIndexed():geo;e.set(0,ry,0);q.setFromEuler(e);m.compose(v.set(x,y,z),q,one);g.applyMatrix4(m);col.set(c);
      const a=g.attributes.position.array;for(let i=0;i<a.length;i+=3){P.push(a[i],a[i+1],a[i+2]);C.push(col.r,col.g,col.b)}return K},
    box:(w,h,d,c,x,y,z,ry)=>K.add(new THREE.BoxGeometry(w,h,d),c,x,y,z,ry),
    cyl:(rt,rb,h,c,x,y,z,n=8)=>K.add(new THREE.CylinderGeometry(rt,rb,h,n),c,x,y,z),
    cone:(r,h,c,x,y,z,n=8,ry=0)=>K.add(new THREE.ConeGeometry(r,h,n),c,x,y,z,ry),
    dome:(r,c,x,y,z)=>K.add(new THREE.SphereGeometry(r,10,5,0,TAU,0,Math.PI/2),c,x,y,z),
    mesh(){const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));g.computeVertexNormals();return new THREE.Mesh(g,LMAT)}};
  return K}

  if(joy){const dx=joy.dx/50,dy=-joy.dy/50;if(Math.hypot(dx,dy)>.15){turn=clamp(dx*1.4,-1,1);thr=dy>0?dy:dy*1.0}}

  const tv=thr>0?thr*MAXV:thr*MAXV*REV,acc=Math.abs(tv)<Math.abs(boat.v)?30:42;
  boat.v+=clamp(tv-boat.v,-acc*dt,acc*dt);
  boat.turn+=(turn-boat.turn)*Math.min(1,dt*6);
  boat.a+=boat.turn*1.9*dt*(.35+.65*Math.min(1,Math.abs(boat.v)/25))*(boat.v<0?-1:1);
  let nx=boat.x+(Math.cos(boat.a)*boat.v+WX.wx)*dt,nz=boat.z+(Math.sin(boat.a)*boat.v+WX.wy)*dt;
  for(const n of NPCS){
    if(n.hornT>0)n.hornT-=dt; // korna: yalnızca pruvanın önündeki koridora girince
    if(!(n.hornT>0)&&!(n.wait>0)){const hx_=boat.x-n.x,hz_=boat.z-n.z,fwd=hx_*Math.cos(n.a)+hz_*Math.sin(n.a),side=-hx_*Math.sin(n.a)+hz_*Math.cos(n.a),ahead=Math.max(n.type==='ferry'?90:130,n.spd*(n.type==='ferry'?5:7));
      if(fwd>n.len*.3&&fwd<n.len*.5+ahead&&Math.abs(side)<n.wid*.5+20){n.hornT=9;SFX.horn(n.type)}}
    const dx=nx-n.x,dz=nz-n.z,ca=Math.cos(n.a),sa=Math.sin(n.a),lx=dx*ca+dz*sa,ly=-dx*sa+dz*ca,hx=n.len*.5+7,hy=n.wid*.5+3.5;
    if(Math.abs(lx)<hx&&Math.abs(ly)<hy){const sd=ly>=0?1:-1,push=hy-Math.abs(ly)+1;nx+=-sa*sd*push;nz+=ca*sd*push;
      if(bumpT<=0){const D=DF();stun=D.stun;bumpT=stun+1.5;boat.v*=.2;SFX.crash();JOB.money-=D.hit;JOB.streak=0;hudUp();toast((LANG==='en'?'Collision! Engine stalled '+D.stun+' s · −₺':'Çarpışma! Motor '+D.stun+' sn durdu · −₺')+D.hit)}}}
  const ok=(x,z)=>nav(x,z,4)&&nav(x+Math.cos(boat.a)*6*Math.sign(boat.v||1),z+Math.sin(boat.a)*6*Math.sign(boat.v||1),1);
  if(ok(nx,nz)){boat.x=nx;boat.z=nz}else if(ok(nx,boat.z)){boat.x=nx;boat.v*=.94}else if(ok(boat.x,nz)){boat.z=nz;boat.v*=.94}else boat.v*=-.25;
  // iskele yakınlığı
  let best=-1,bd=1e9;for(let i=0;i<PIERS.length;i++){const p=PIERS[i],d=Math.hypot(p.wx-boat.x,p.wz-boat.z);if(d<bd){bd=d;best=i}}
  const np=bd<30&&Math.abs(boat.v)<24?best:-1;
  if(np!==nearPier){nearPier=np;if(np>=0){$('pierN').textContent=PIERS[np].name;$('pier').classList.remove('hide')}else $('pier').classList.add('hide')}
  jobStep(dt);jobUiT+=dt;if(jobUiT>.25){jobUiT=0;renderJob();fuelUi()}
  saveT+=dt;if(saveT>6){saveT=0;saveG()}
  {const sf=Math.min(1,Math.abs(boat.v)/MAXV);SFX.engine(stun>0||JOB.fuel<=0?0:.018+.05*sf,46+64*sf)}
  // dümen suyu

    box(L*.7,.6,W*.82,'#9a6a4e',L*.05,5.5);box(L*.62,.9,1.4,'#b9bcc0',L*.05,6.2);box(L*.62,.9,1.4,'#b9bcc0',L*.05,6.2,W*.22);box(L*.62,.9,1.4,'#b9bcc0',L*.05,6.2,-W*.22);
    for(const k of[-.18,.02,.22])box(1,3,W*.7,'#b9bcc0',L*k,7);
    box(9,11,W*.8,'#fbfbf8',-L/2+9,10.8);box(9.2,1.2,W*.82,'#2a4152',-L/2+9,13.6);box(4,1.4,W*1.04,'#fbfbf8',-L/2+10,15.4);
    box(3,5,4,n.col,-L/2+4.5,16.5);add(new THREE.CylinderGeometry(.25,.25,9,5),'#dddddd',L/2-8,9.8);
  }else{ // kruvaziyer
    add(hullGeo(L,W,2,-1.6,.22,.06),'#1e3f66');add(hullGeo(L,W,5,.4,.22,.06),'#fbfbf8');
    box(L*.72,2.6,W*.88,'#fbfbf8',-L*.03,6.7);box(L*.725,1,W*.89,'#2a4152',-L*.03,6.9);
    box(L*.64,2.4,W*.8,'#fbfbf8',-L*.05,9.2);box(L*.645,.9,W*.81,'#2a4152',-L*.05,9.4);
    box(L*.5,2.2,W*.72,'#fbfbf8',-L*.07,11.5);box(L*.505,.8,W*.73,'#2a4152',-L*.07,11.7);
    box(5,4,4,'#0e8f9a',-L*.16,14.6);box(3,1.6,W*.9,'#fbfbf8',L*.2,12.6);
  }
  const g=K.mesh();scene.add(g);return g}
function buildNpcs(){for(const n of NPCS)scene.remove(n.m);NPCS.length=0;const d=DF(),up=TPATH.slice().reverse();
  const add=(o,pts)=>{o.r=mkRoute(pts,true);if(!routeOk(o)){o.r=mkRoute(pts,false);if(!routeOk(o))return}o.s=o.s0*o.r.len;o.m=mkShip(o);NPCS.push(o)};
  [[TPATH,.22,30,88,17,'#8c3b2b'],[up,.6,27,100,18,'#2b4c5e'],[TPATH,.66,30,94,17,'#3d5a45'],[up,.18,27,84,16,'#6b4a2b']].slice(0,d.tank)
    .forEach(q=>add({type:'tanker',s0:q[1],dir:1,lane:26,spd:q[2]*d.spd,len:q[3],wid:q[4],col:q[5],wait:0},q[0]));
  CRUISE.slice(0,d.cr).forEach((pts,i)=>add({type:'cruise',s0:i?1:0,dir:i?-1:1,lane:54,spd:24*d.spd,len:58,wid:13,col:'#ffffff',wait:i?4:d.wb*.5,wb:d.wb,ws:10},pts));
  FROUTES.slice(0,d.ferry).forEach(r=>add({type:'ferry',s0:0,dir:1,lane:10,spd:30*d.spd,len:46,wid:12,col:'#f8f9fa',wait:Math.random()*14},r.flatMap((q,i)=>{if(typeof q[0]!=='string')return[q];const o=stopOf(q[0]);return !o.ap?[o.at]:i===0?[o.at,o.ap]:[o.ap,o.at]})));
  updateNpcs(0)}
function updateNpcs(dt){
  NPCS.forEach((n,i)=>{
    if(n.wait>0){n.wait-=dt;n.st=0}
    else{if(n.gh>0)n.gh-=dt;const s1=n.s+n.dir*n.spd*dt,q=posOn(n,s1);let hold=false;
      // yol verme: önceliği düşük gemi, üstüne bineceği gemiyi bekler; 6 sn kilitlenirse 4 sn serbest geçer
      if(n.x!=null&&!(n.gh>0))for(let k=0;k<NPCS.length&&!hold;k++){if(k===i)continue;const o=NPCS[k];if(o.x==null)continue;
        if(boxHit(q.x,q.z,q.a,n.len,n.wid,o,4)){const away=Math.hypot(q.x-o.x,q.z-o.z)>Math.hypot(n.x-o.x,n.z-o.z);
          if(!away&&(PRIO[n.type]<PRIO[o.type]||(PRIO[n.type]===PRIO[o.type]&&i>k)||o.wait>0))hold=true}}
      if(hold){if((n.st=(n.st||0)+dt)>6){n.gh=4;n.st=0}}
      else{n.st=0;n.s=s1;
        if(n.type==='tanker'){if(n.s>n.r.len)n.s=0}
        else if(n.s>=n.r.len){n.s=n.r.len;n.dir=-1;n.wait=n.type==='cruise'?n.ws:5}
        else if(n.s<=0){n.s=0;n.dir=1;n.wait=n.type==='cruise'?n.wb:5}}}
    const p=posOn(n,n.s);n.x=p.x;n.z=p.z;n.a=p.a;n.tg=p.tg});
}
function drawNpcs(dt){for(const n of NPCS){const m=n.m;
    // vapurun iki ucu aynı: dönüşte çevrilmez. Diğerleri yavaşça döner.
    const want=n.type==='ferry'?n.tg:n.a;if(n.ra==null)n.ra=want;let da=((want-n.ra+Math.PI)%TAU+TAU)%TAU-Math.PI;n.ra+=clamp(da,-dt*.5,dt*.5)+(Math.abs(da)<.6?da*Math.min(1,dt*4):0)*.5;
    // uzaktaki giriş/çıkış noktalarında gemi küçülerek kaybolur (ansızın belirmesin)
    const k=n.type==='tanker'?clamp(Math.min(n.s,n.r.len-n.s)/220,0,1):n.type==='cruise'?clamp((n.r.len-n.s)/220,0,1):1;
    m.visible=k>.02;m.scale.setScalar(Math.max(k,.02));m.position.set(n.x,wave(n.x,n.z,time)*.2,n.z);m.rotation.y=-n.ra}}

/* ================= Başlangıç ekranı ================= */
let pickD='orta',startMode='new';
function renderStart(){const en=LANG==='en',cont=startMode==='cont',D=DIFF[pickD];
  $('sDiff').hidden=$('sInfo').hidden=cont;
  $('sDiff').innerHTML=Object.keys(DIFF).map(k=>`<button type="button" data-d="${k}" aria-pressed="${k===pickD}">${L2(DIFF[k].n)}</button>`).join('');
  $('sInfo').innerHTML=`<span>${en?'Pay':'Ücret'} %${Math.round(D.pay*100)}</span><span>${en?'Time':'Süre'} %${Math.round(D.time*100)}</span><span>🚢 ${D.tank+D.ferry+D.cr} ${en?'ships':'gemi'}</span><span>${en?'Crash':'Çarpışma'} −₺${D.hit}</span>`;
  $('sGo').textContent=cont?(en?'Continue':'Devam et')+' · '+L2(DF().n)+' · ₺'+JOB.money.toLocaleString(en?'en-US':'tr-TR'):(en?'Start':'Başla');
  $('sAlt').hidden=!HAS_SAVE;$('sAlt').textContent=cont?(en?'New game':'Yeni oyun'):(en?'Back':'Geri')}
function showStart(){startMode=HAS_SAVE?'cont':'new';pickD=JOB.diff;paused=true;document.body.classList.add('menu');renderStart();$('start').classList.remove('hide')}
function startGame(fresh){
  if(fresh){Object.assign(JOB,{fuel:TANK,diff:pickD,cur:null,offers:null,offPier:-1,money:250,done:0,ontime:0,streak:0,best:0});newGoals(0)}
  HAS_SAVE=true;stun=0;bumpT=0;boat.v=0;wxReset();SFX.resume();
  const s=PIERS.find(p=>p.name==='Karaköy');boat.a=Math.atan2(-s.dz,-s.dx)+.9;boat.x=s.wx-s.dx*14;boat.z=s.wz-s.dz*14;
  buildNpcs();hudUp();fuelUi();renderGoals();renderJob();renderOffers();saveG();camStep(0,true);
  paused=false;document.body.classList.remove('menu');$('start').classList.add('hide');
  started=false;$('hint').classList.remove('hide');setTimeout(()=>firstInput(),9000)}
const sndUi=()=>{$('snd').textContent=SND_ON?'🔊':'🔇'};sndUi();
$('snd').addEventListener('click',()=>{const v=!SND_ON;SFX.setOn(v);MUS.setOn(v);try{localStorage.setItem(SND_KEY,v?'1':'0')}catch(_){}sndUi()});
$('sDiff').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){pickD=b.dataset.d;renderStart()}});
$('sGo').addEventListener('click',()=>startGame(startMode==='new'));
$('sAlt').addEventListener('click',()=>{startMode=startMode==='cont'?'new':'cont';renderStart()});
$('tow').addEventListener('click',()=>{let best=-1,bd=1e9;PIERS.forEach((p,i)=>{if(!p.fuel)return;const d=Math.hypot(p.wx-boat.x,p.wz-boat.z);if(d<bd){bd=d;best=i}});
  const p=PIERS[best];JOB.money-=TOW;JOB.fuel=TANK;boat.x=p.wx-p.dx*14;boat.z=p.wz-p.dz*14;boat.v=0;camStep(0,true);hudUp();fuelUi();saveG();
  toast((LANG==='en'?'Towed to '+p.name+', tank full · −₺':'Çekici seni '+p.name+' iskelesine getirdi, depo dolu · −₺')+TOW)});

/* ---------- Kamera ---------- */
const cam={x:0,y:30,z:0,lx:0,ly:0,lz:0};
function camStep(dt,snap){const ca=Math.cos(boat.a),sa=Math.sin(boat.a),sp=Math.abs(boat.v)/MAXV,back=30+sp*8,up=11+sp*3;
  let tx=boat.x-ca*back,tz=boat.z-sa*back,ty=up;const gh=hgt(tx,tz);if(gh+5>ty)ty=gh+5;
  const k=snap?1:1-Math.exp(-dt*3.2);cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;cam.z+=(tz-cam.z)*k;
  const lx=boat.x+ca*16,lz=boat.z+sa*16,kl=snap?1:1-Math.exp(-dt*6);cam.lx+=(lx-cam.lx)*kl;cam.ly+=(3-cam.ly)*kl;cam.lz+=(lz-cam.lz)*kl;
  camera.position.set(cam.x,cam.y,cam.z);camera.lookAt(cam.lx,cam.ly,cam.lz)}

/* ================= Çizim döngüsü ================= */
function render(dt){
  WMAT.uniforms.uTime.value=time;
  const st=WATER.userData.step;WATER.position.set(Math.round(cam.x/st)*st,0,Math.round(cam.z/st)*st);sky.position.copy(camera.position);
  // tekne: dalga üstünde sallanma, dönüşte yatma, hızla burun kalkması
  const ca=Math.cos(boat.a),sa=Math.sin(boat.a),sp=Math.abs(boat.v)/MAXV;
  const hf=wave(boat.x+ca*5,boat.z+sa*5,time),hb=wave(boat.x-ca*5,boat.z-sa*5,time),hl=wave(boat.x-sa*2.5,boat.z+ca*2.5,time),hr=wave(boat.x+sa*2.5,boat.z-ca*2.5,time);
  const k=1-Math.exp(-dt*5);boat.pitch+=((hf-hb)/10*.9+sp*.07-(boat.v<0?.03:0)-boat.pitch)*k;boat.roll+=((hl-hr)/5*.6-boat.turn*sp*.18-boat.roll)*k;
  BOAT.position.set(boat.x,(hf+hb+hl+hr)/4+.15+sp*.4,boat.z);BOAT.rotation.set(0,-boat.a,0);BOAT.userData.hull.rotation.set(boat.roll,0,boat.pitch);
  // köpük
  for(let i=0;i<WAKE.N;i++){const w=WAKE.list[i];if(w.l>0){w.l-=dt*.45;w.x+=w.vx*dt;w.z+=w.vz*dt;w.vx*=.985;w.vz*=.985;w.s+=dt*2.2}
    WAKE.pos[i*3]=w.x;WAKE.pos[i*3+1]=wave(w.x,w.z,time)+.25;WAKE.pos[i*3+2]=w.z;WAKE.al[i]=Math.max(0,w.l);WAKE.sz[i]=w.s||0}
  WAKE.g.attributes.position.needsUpdate=WAKE.g.attributes.a.needsUpdate=WAKE.g.attributes.s.needsUpdate=true;
  // iskele adları ve halkalar: yalnızca yakındayken
  for(let i=0;i<PIERS.length;i++){const p=PIERS[i],d=Math.hypot(p.wx-cam.x,p.wz-cam.z);
    LABELS[i].material.opacity=clamp((620-d)/220,0,1);LABELS[i].visible=d<620;
    const r=RINGS[i];r.visible=d<500;if(r.visible){r.position.y=wave(p.wx,p.wz,time)+.35;const tg=i===JOB.target();r.visible=r.visible||tg;r.material.color.set(tg?'#ff7a45':'#ffffff');r.material.opacity=tg?.9:(i===nearPier?.95:.45+.25*Math.sin(time*3+i))*clamp((500-d)/150,0,1);r.scale.setScalar(tg?1.25+.1*Math.sin(time*5):i===nearPier?1.15:1)}}
  atmos(dt);drawNpcs(dt);lmStep();
  renderer.render(scene,camera);drawMini();
}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?68:56;camera.updateProjectionMatrix();if(WAKE)WAKE.mat.uniforms.uScale.value=h*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360))}
addEventListener('resize',resize);

let last=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-(last||now))/1000);last=now;if(paused){time+=dt;updateNpcs(dt);SFX.engine(0,46)}else step(dt);camStep(dt);render(dt)}

/* ================= Başlat ================= */
setTimeout(()=>{
  buildTerrain();buildWater();buildPiers();BRIDGES.forEach(buildBridge);buildKizKulesi();defLandmarks();buildLandmarks();buildTown();
  BOAT=buildBoat();WAKE=buildWake();buildMini();
  {const g=new THREE.CylinderGeometry(6,6,140,20,1,true);g.translate(0,70,0);BEAM=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:'#ff7a45',transparent:true,opacity:.4,depthWrite:false,side:THREE.DoubleSide}));BEAM.visible=false;scene.add(BEAM)}
  loadG();hudUp();renderGoals();
  const s=PIERS.find(p=>p.name==='Karaköy');boat.a=Math.atan2(-s.dz,-s.dx)+.9;boat.x=s.wx-s.dx*14;boat.z=s.wz-s.dz*14;
  resize();camStep(0,true);
  $('load').style.opacity=0;setTimeout(()=>$('load').remove(),700);
  showStart();fuelUi();
  requestAnimationFrame(frame);
  window.__bt3d={WX,setTime:v=>{time=v},LM,NPCS,startGame,DIFF,setDiff:d=>{pickD=d},boat,PIERS,BRIDGES,JOB,GOALS:()=>GOALS,jobStep,setCam:()=>camStep(0,true),step,render,renderer,camera};
},30);
</script>
