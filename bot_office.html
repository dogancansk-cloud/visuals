:root{--ink:#22201d;--ink2:#5a544c;--mute:#8d867c;--glass:rgba(255,253,249,.72);--line:rgba(255,255,255,.9);--acc:#EF7D22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#f2eee7;font-family:'Fig',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#paper{position:fixed;inset:0;background:radial-gradient(90% 70% at 50% 42%,#fbf9f5 0%,#f2eee7 62%,#e8e2d8 100%)}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;height:100dvh;display:block;touch-action:none;filter:saturate(1.14) contrast(1.05)}
.dof{position:fixed;left:0;right:0;pointer-events:none;z-index:2;-webkit-backdrop-filter:blur(2.2px);backdrop-filter:blur(2.2px)}
#dofT{top:0;height:17%;-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 100%)}
#dofB{bottom:0;height:15%;-webkit-mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,0) 100%);mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,0) 100%)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;transition:opacity .4s}
body.focus #labels{opacity:0}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,253,249,.86);padding:4px 9px 4px 7px;border-radius:999px;box-shadow:0 3px 12px rgba(60,40,20,.14);display:flex;align-items:center;gap:5px;transform:translate(-50%,-50%)}
.lbl i{width:8px;height:8px;border-radius:50%;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);box-shadow:0 12px 40px rgba(60,40,20,.16),0 1px 0 rgba(255,255,255,.6) inset}
#top{position:fixed;z-index:6;left:max(14px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));border-radius:999px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px}
#top b{font-size:14px;font-weight:800;letter-spacing:-.01em}#top span{font-size:12px;color:var(--ink2);font-weight:600}
.seg{display:inline-flex;background:rgba(40,30,20,.07);border-radius:999px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:12px;font-weight:750;border:0;background:transparent;color:var(--ink2);padding:5px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(60,40,20,.14)}
#hint{position:fixed;z-index:6;left:50%;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 52px);transform:translateX(-50%);font-size:12.5px;font-weight:650;color:var(--ink2);padding:8px 14px;border-radius:999px;white-space:nowrap;transition:opacity .4s}
body.focus #hint{opacity:0}
#chips{position:fixed;z-index:6;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;padding:2px 12px;justify-content:center;scrollbar-width:none;transition:opacity .4s,transform .4s}
#chips::-webkit-scrollbar{display:none}
body.focus #chips{opacity:0;pointer-events:none;transform:translateY(20px)}
.chip{flex:none;font:inherit;font-size:12.5px;font-weight:750;color:var(--ink);border:1px solid var(--line);background:rgba(255,253,249,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px;padding:7px 11px 7px 8px;display:flex;align-items:center;gap:6px;cursor:pointer;box-shadow:0 4px 14px rgba(60,40,20,.12)}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
body.render #chips{display:none}
#card{position:fixed;z-index:7;right:24px;top:50%;transform:translateY(-50%);width:380px;max-height:calc(100dvh - 48px);overflow:auto;border-radius:24px;padding:18px 20px 16px;transition:opacity .35s,transform .45s cubic-bezier(.2,.8,.2,1)}
#card[hidden]{display:block;opacity:0;pointer-events:none;transform:translateY(-46%)}
#cHead{display:flex;align-items:center;gap:10px}
#cDot{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
#cName{font-size:22px;font-weight:850;letter-spacing:-.02em;line-height:1.05}

<script>/* ===== Doğancan's office v2: warm miniature diorama (three.js r147, procedural) ===== */
const Q = new URLSearchParams(location.search);
const RENDER = Q.has('render') || Q.has('still');   // still = UI visible but driven by window.seek (for screenshots)
const DATA = JSON.parse(document.getElementById('officeData').textContent);
// the JSON uses 2D tile coordinates (x, y); the 3D scene uses x and z on the floor and y for height
DATA.seats.forEach(s => { if (s.z === undefined) s.z = s.y; }); DATA.walkGraph.nodes.forEach(n => { if (n.z === undefined) n.z = n.y; });
{ const t = DATA.tray; DATA.tray = {x: t.x, z: t.z !== undefined ? t.z : t.y, y: t.height !== undefined ? t.height : t.y}; }
['waterBar', 'welcome'].forEach(k => { const o = DATA.shared[k]; if (o.z === undefined) o.z = o.y; });
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, alpha: true, preserveDrawingBuffer: RENDER, powerPreference: 'high-performance'});
renderer.setClearColor(0x000000, 0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
renderer.physicallyCorrectLights = false;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(17, 1, 1, 600);

/* ---------- seeded random ---------- */
let _seed = 1234567;
function rnd() { _seed |= 0; _seed = _seed + 0x6D2B79F5 | 0; let t = Math.imul(_seed ^ _seed >>> 15, 1 | _seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function rr(a, b) { return a + (b - a) * rnd(); }
function pick(a) { return a[Math.floor(rnd() * a.length)]; }

/* ---------- lights: soft daylight from the upper-left back, a warm front fill, sky/bounce hemisphere ---------- */
const hemi = new THREE.HemisphereLight(0xe4efff, 0xd9b48a, 0.42); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeccf, 1.9); sun.castShadow = true;
sun.position.set(19 - 24, 36, 19 - 15); sun.target.position.set(19, 0, 19); scene.add(sun, sun.target);
sun.shadow.mapSize.set(2048, 2048); { const s = sun.shadow.camera; s.left = -30; s.right = 30; s.top = 30; s.bottom = -30; s.near = 5; s.far = 110; }
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 4;
const fill = new THREE.DirectionalLight(0xffe7cf, 0.42); fill.position.set(19 + 30, 26, 19 + 34); fill.target.position.set(19, 0, 19); scene.add(fill, fill.target);

/* ---------- environment light (PMREM of a soft studio-sky room) ---------- */
(function makeEnv() {
  const es = new THREE.Scene();
  const g = new THREE.SphereGeometry(50, 32, 16); const col = []; const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) { const y = p.getY(i) / 50; const c = new THREE.Color().lerpColors(new THREE.Color(0xd9b892), new THREE.Color(0xcfe3ff), THREE.MathUtils.clamp(y * 0.5 + 0.5, 0, 1)); col.push(c.r, c.g, c.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
